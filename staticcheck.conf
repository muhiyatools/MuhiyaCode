# ST1005 ("error strings should not end with punctuation") is off for this
# repository, and the reason is structural rather than a matter of taste.
#
# Most error strings here are not developer-facing. Tool handlers return the
# instruction bodies from internal/instructions verbatim, and those strings are
# delivered to a language model as the tool's result — they are prompt text that
# happens to travel through the error channel. They are written as complete
# sentences on purpose, their exact bytes are pinned by the instruction goldens,
# and rewording them to satisfy a Go style rule would change the prompt and cost
# a cache epoch for no reader's benefit.
checks = ["inherit", "-ST1005"]
