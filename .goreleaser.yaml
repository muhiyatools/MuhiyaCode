# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.17.0/www/docs/static/schema.json
version: 2
project_name: muhiyacode

builds:
  - id: muhiyacode
    main: ./cmd/muhiyacode
    binary: muhiyacode
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/muhiya/muhiyacode/internal/buildinfo.Version={{ .Version }}
      - -X github.com/muhiya/muhiyacode/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/muhiya/muhiyacode/internal/buildinfo.Date={{ .Date }}
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: release
    ids:
      - muhiyacode
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/*.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  draft: false
  prerelease: auto
  mode: replace

