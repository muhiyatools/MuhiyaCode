name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Check formatting
        run: make check-fmt
      - name: Vet
        run: go vet ./...
      - name: Install pinned quality tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Static analysis
        run: staticcheck ./...
      - name: Vulnerability scan
        run: govulncheck ./...
      - name: Race tests
        env:
          CGO_ENABLED: "1"
        run: go test -race ./... -count=1

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -count=1
      - run: go build -trimpath ./cmd/muhiyacode
      - name: Sandbox and recovery conformance
        run: go test ./internal/workspace ./internal/mcpclient ./internal/state -run "Sandbox|PatchJournal|ExecutionTaskLifecycle|Process" -count=1

  fuzz-and-chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Schema fuzzer
        run: go test ./internal/orchestrator -run=^$ -fuzz=FuzzValidateCallArgsNeverPanics -fuzztime=30s
      - name: Input/render fuzzers
        run: |
          go test ./internal/tui -run=^$ -fuzz=FuzzPasteRoundTrip -fuzztime=30s
          go test ./internal/tui -run=^$ -fuzz=FuzzRenderForDisplay -fuzztime=30s
      - name: Fault-injection repetition
        run: go test ./internal/orchestrator -run=TestFaultInjectionCatalog -count=10
      - name: Transaction and sandbox repetition
        run: go test ./internal/workspace -run='Test(PatchJournal|Sandbox|ShellRunner)' -count=5

  benchmark-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate pinned benchmark manifest and fixtures
        run: go run ./cmd/muhiyacode benchmark --manifest benchmarks/manifest.example.json --validate-only
      - name: Benchmark runner contract tests
        run: go test ./internal/command -run=Benchmark -count=1
      - name: Generated capability documentation
        run: go run ./cmd/muhiyacode docs check

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean

  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm run check:npm
      - run: npm pack --dry-run
