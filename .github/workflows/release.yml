name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release source
        run: |
          go mod verify
          make check-fmt
          go vet ./...
          CGO_ENABLED=1 go test -race ./... -count=1
          npm run check:npm
          npm pack --dry-run
      - name: Build and publish archives
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release checksums
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt
      - name: Publish npm wrapper
        # Configure npm trusted publishing for muhiyatools/MuhiyaCode and this
        # release.yml workflow before pushing the v1.1.0 tag.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME (=$VERSION) != package.json version $PKG_VERSION"
            exit 1
          fi
          npm publish --access public
