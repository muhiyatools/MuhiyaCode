<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNAKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --ink: #00ff9d;
  --ink-dim: #00ff9d66;
  --grid: #15301f;
  --food: #ff2d75;
  --food-glow: #ff2d7566;
  --warn: #ffb800;
  --frame: #2a2a2a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: 'VT323', monospace;
  display: grid;
  place-items: center;
  overflow: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 2px,
    rgba(0,0,0,0.18) 2px,
    rgba(0,0,0,0.18) 4px
  );
  pointer-events: none;
  z-index: 10;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
  pointer-events: none;
  z-index: 9;
}
.cabinet {
  position: relative;
  border: 2px solid var(--frame);
  padding: 28px 32px 24px;
  background: linear-gradient(180deg, #0f0f0f 0%, #060606 100%);
  box-shadow:
    inset 0 0 0 1px var(--ink-dim),
    inset 0 0 40px rgba(0, 255, 157, 0.04),
    0 8px 60px rgba(0, 0, 0, 0.9);
}
.cabinet::before {
  content: 'MIDNIGHT ARCADE — EST. 1983';
  position: absolute;
  top: -7px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg);
  padding: 0 10px;
  font-size: 9px;
  letter-spacing: 4px;
  color: var(--warn);
  font-family: 'Press Start 2P', monospace;
}
.title {
  font-family: 'Press Start 2P', monospace;
  font-size: 22px;
  text-align: center;
  letter-spacing: 6px;
  margin-bottom: 18px;
  color: var(--ink);
  text-shadow: 0 0 10px rgba(0, 255, 157, 0.5);
}
.hud {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 22px;
  letter-spacing: 2px;
}
.hud .label { color: var(--ink-dim); margin-right: 6px; }
.hud .val { color: var(--ink); font-variant-numeric: tabular-nums; }
.stage {
  position: relative;
  border: 2px solid var(--ink-dim);
  box-shadow: 0 0 20px rgba(0, 255, 157, 0.08) inset;
}
canvas {
  display: block;
  background: var(--bg);
  image-rendering: pixelated;
}
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(10, 10, 10, 0.88);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 18px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s;
  font-family: 'Press Start 2P', monospace;
}
.overlay.show { opacity: 1; pointer-events: auto; }
.overlay h2 {
  font-size: 18px;
  letter-spacing: 4px;
  color: var(--food);
  text-shadow: 0 0 12px var(--food-glow);
}
.overlay h2.paused { color: var(--warn); text-shadow: 0 0 12px rgba(255, 184, 0, 0.4); }
.overlay p {
  font-family: 'VT323', monospace;
  font-size: 20px;
  letter-spacing: 3px;
  color: var(--ink);
  animation: blink 1.2s steps(2) infinite;
}
@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0.15; }
}
.foot {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin-top: 14px;
  font-size: 18px;
  color: var(--ink-dim);
  letter-spacing: 1.5px;
}
.foot kbd {
  font-family: 'VT323', monospace;
  background: transparent;
  border: 1px solid var(--ink-dim);
  padding: 0 6px;
  color: var(--ink);
  margin-right: 5px;
  font-size: 16px;
}
</style>
</head>
<body>
  <div class="cabinet">
    <h1 class="title">SNAKE</h1>
    <div class="hud">
      <div><span class="label">SCORE</span><span class="val" id="score">00</span</div>
      <div><span class="label">BEST</span><span class="val" id="best">00</span</div>
   </div>
    <div class="stage">
      <canvas id="game" width="400" height="400</canvas>
      <div class="overlay" id="overlay">
        <h2 id="oTitle">GAME OVER</h2>
        <p id="oPrompt">PRESS R</p>
     </div>
   </div>
    <div class="foot">
      <span><kbd>ARROWS</kbd> MOVE</span>
      <span><kbd>SPACE</kbd> PAUSE</span>
      <span><kbd>R</kbd> RESET</span>
   </div>
 </div>
<!--MARKER-->
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const oTitle = document.getElementById('oTitle');
  const oPrompt = document.getElementById('oPrompt');

  const CELL = 20;
  const COLS = canvas.width / CELL;
  const ROWS = canvas.height / CELL;
  const STEP = 110;

  // Pre-render static background (board + dot grid + frame) once.
  const bg = document.createElement('canvas');
  bg.width = canvas.width;
  bg.height = canvas.height;
  {
    const b = bg.getContext('2d', { alpha: false });
    b.fillStyle = '#0a0a0a';
    b.fillRect(0, 0, bg.width, bg.height);
    b.fillStyle = '#15301f';
    for (let y = 0; y < ROWS; y++) {
      const py = y * CELL + CELL / 2 - 0.5;
      for (let x = 0; x < COLS; x++) {
        b.fillRect(x * CELL + CELL / 2 - 0.5, py, 1, 1);
      }
    }
    b.strokeStyle = '#1f4830';
    b.lineWidth = 1;
    b.strokeRect(0.5, 0.5, bg.width - 1, bg.height - 1);
  }

  // Snake as [head, ..., tail] using plain objects (small array, fast enough).
  const snake = [];
  let dirX = 1, dirY = 0;
  let nextX = 1, nextY = 0;
  let fx = 0, fy = 0;
  let score = 0;
  let best = 0;
  try { best = parseInt(localStorage.getItem('snake.best') || '0', 10) || 0; } catch (e) {}
  let alive = true;
  let paused = false;
  let frame = 0;
  let last = 0;
  let acc = 0;
  let rafId = 0;

  function placeFood() {
    const free = COLS * ROWS - snake.length;
    if (free <= 0) return;
    let pick = (Math.random() * free) | 0;
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        let onSnake = false;
        for (let i = 0; i < snake.length; i++) {
          if (snake[i].x === x && snake[i].y === y) { onSnake = true; break; }
        }
        if (onSnake) continue;
        if (pick-- === 0) { fx = x; fy = y; return; }
      }
    }
  }

  function reset() {
    snake.length = 0;
    snake.push({ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 });
    dirX = 1; dirY = 0;
    nextX = 1; nextY = 0;
    score = 0;
    alive = true;
    paused = false;
    placeFood();
    updateHud();
    hideOverlay();
  }

  function updateHud() {
    scoreEl.textContent = String(score).padStart(2, '0');
    bestEl.textContent = String(best).padStart(2, '0');
  }

  function showOverlay(title, pausedFlag) {
    oTitle.textContent = title;
    oTitle.className = pausedFlag ? 'paused' : '';
    oPrompt.textContent = pausedFlag ? 'PRESS SPACE' : 'PRESS R';
    overlay.classList.add('show');
  }

  function hideOverlay() { overlay.classList.remove('show'); }

  function setDir(nx, ny) {
    if (snake.length > 1 && dirX + nx === 0 && dirY + ny === 0) return;
    nextX = nx; nextY = ny;
  }

  function tick() {
    if (!alive || paused) return;
    dirX = nextX; dirY = nextY;
    const head = snake[0];
    const nx = head.x + dirX;
    const ny = head.y + dirY;
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return die();
    for (let i = 0; i < snake.length; i++) {
      if (snake[i].x === nx && snake[i].y === ny) return die();
    }
    snake.unshift({ x: nx, y: ny });
    if (nx === fx && ny === fy) {
      score++;
      if (score > best) {
        best = score;
        try { localStorage.setItem('snake.best', String(best)); } catch (e) {}
      }
      updateHud();
      placeFood();
    } else {
      snake.pop();
    }
  }

  function die() {
    alive = false;
    showOverlay('GAME OVER', false);
  }

  function draw() {
    ctx.drawImage(bg, 0, 0);

    // Food with subtle pulse + glow.
    frame++;
    const pulse = (Math.sin(frame * 0.15) + 1) * 0.5;
    const cx = fx * CELL + CELL / 2;
    const cy = fy * CELL + CELL / 2;
    ctx.fillStyle = 'rgba(255, 45, 117, 0.18)';
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * 0.9, 0, Math.PI * 2);
    ctx.fill();
    const r = CELL / 2 - 2 + pulse * 1.5;
    ctx.fillStyle = '#ff2d75';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffb0c8';
    ctx.beginPath();
    ctx.arc(cx - 2, cy - 2, r * 0.3, 0, Math.PI * 2);
    ctx.fill();

    // Snake body (tail to head so head paints on top).
    const len = snake.length;
    for (let i = len - 1; i >= 0; i--) {
      const s = snake[i];
      const x = s.x * CELL;
      const y = s.y * CELL;
      if (i === 0) {
        ctx.fillStyle = '#00ff9d';
        ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
        ctx.fillStyle = '#0a0a0a';
        if (dirX === 1) {
          ctx.fillRect(x + CELL - 6, y + 5, 2, 2);
          ctx.fillRect(x + CELL - 6, y + CELL - 7, 2, 2);
        } else if (dirX === -1) {
          ctx.fillRect(x + 4, y + 5, 2, 2);
          ctx.fillRect(x + 4, y + CELL - 7, 2, 2);
        } else if (dirY === 1) {
          ctx.fillRect(x + 5, y + CELL - 6, 2, 2);
          ctx.fillRect(x + CELL - 7, y + CELL - 6, 2, 2);
        } else {
          ctx.fillRect(x + 5, y + 4, 2, 2);
          ctx.fillRect(x + CELL - 7, y + 4, 2, 2);
        }
      } else {
        const t = i / len;
        const g = (255 - t * 180) | 0;
        const b = (157 - t * 130) | 0;
        ctx.fillStyle = 'rgb(0,' + g + ',' + b + ')';
        ctx.fillRect(x + 2, y + 2, CELL - 4, CELL - 4);
      }
    }
  }

  function loop(now) {
    if (!last) last = now;
    const dt = now - last;
    last = now;
    if (alive && !paused) {
      acc += dt;
      if (acc > STEP * 5) acc = STEP * 5;
      while (acc >= STEP) {
        tick();
        acc -= STEP;
      }
    }
    draw();
    rafId = requestAnimationFrame(loop);
  }

  function restart() {
    cancelAnimationFrame(rafId);
    reset();
    last = 0;
    acc = 0;
    rafId = requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') { e.preventDefault(); setDir(0, -1); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { e.preventDefault(); setDir(0, 1); }
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); setDir(-1, 0); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); setDir(1, 0); }
    else if (k === ' ' || k === 'Spacebar') {
      e.preventDefault();
      if (alive) {
        paused = !paused;
        if (paused) showOverlay('PAUSED', true);
        else hideOverlay();
      }
    } else if (k === 'r' || k === 'R') {
      e.preventDefault();
      restart();
    }
  });

  overlay.addEventListener('click', () => {
    if (!alive) restart();
    else if (paused) { paused = false; hideOverlay(); }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && alive && !paused) {
      paused = true;
      showOverlay('PAUSED', true);
    }
  });

  bestEl.textContent = String(best).padStart(2, '0');
  reset();
  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
